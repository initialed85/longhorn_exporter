# Build, publish, and deploy longhorn-exporter (home-dev, namespace `observability`).
#
# `exporter.py` is a single-file Python exporter and `docker/Dockerfile` copies it into
# python:3.13-slim-trixie, so there is nothing to compile. The gate is the test suite:
# `test_exporter.py` reproduces the stale-series bug in-process (a deleted volume, a changed
# label value) with the API replaced by a fake, so it needs no cluster, no docker and no
# network -- and it fails against the pre-fix exporter.py, which is what makes it a
# regression gate rather than a description of whatever the file currently does.
#
# This lane is why the fix was lost once already: the exporter was fixed in home-ops, the
# image kept being published from here, and `py_compile` was the only check -- a typo check
# cannot notice that a whole class of wrong output is being shipped.
#
# The deploy step writes into the shared `observability/kustomization.yaml` (see strata_exporter's
# build.yaml for why two pipelines can stamp one file safely).
steps:
  - name: test
    image: docker.io/library/python:3.13-slim-trixie
    commands:
      - python3 --version
      - python3 -m py_compile exporter.py test_exporter.py
      - python3 -c 'import ast,sys; ast.parse(open("exporter.py").read()); print("exporter.py parses")'
      # Same pins as docker/Dockerfile: a test that resolves different dependency versions
      # than the image it is guarding is testing a different program.
      - pip install --no-cache-dir --root-user-action=ignore prometheus_client==0.26.0 requests==2.34.2
      - python3 -m unittest -v test_exporter

  - name: build-and-push
    image: docker.io/library/docker:cli
    privileged: true
    depends_on: [test]
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
      IMAGE: docker.io/initialed85/longhorn-exporter
    backend_options:
      kubernetes:
        secrets:
          - name: dockerhub
            key: username
            target:
              env: DOCKERHUB_USER
          - name: dockerhub
            key: token
            target:
              env: DOCKERHUB_TOKEN
    commands:
      - docker info --format 'daemon={{.Name}}'
      - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
      - docker build --pull --progress=plain --platform=linux/amd64 -f docker/Dockerfile -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest" .
      - docker push "$IMAGE:$CI_COMMIT_SHA"
      - docker push "$IMAGE:latest"
      - docker inspect --format 'digests={{.RepoDigests}}' "$IMAGE:$CI_COMMIT_SHA"

  - name: deploy-home-ops
    image: docker.io/initialed85/wp-kustomize-deploy:latest
    depends_on: [build-and-push]
    settings:
      image: docker.io/initialed85/longhorn-exporter
      dir: clusters/dev/applications/observability
    backend_options:
      kubernetes:
        secrets:
          - name: home-ops-deploy-key
            key: id_ed25519
            target:
              env: PLUGIN_DEPLOY_KEY
          - name: home-ops-deploy-key
            key: known_hosts
            target:
              env: PLUGIN_KNOWN_HOSTS

when:
  - event: push
    branch: main
